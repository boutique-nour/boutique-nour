<title>Boutique Nour | أرقى مستحضرات التجميل والعطور</title>
<meta name="description" content="Boutique Nour: ديور وشانيل ومستحضرات تجميل فاخرة. توصيل سريع لـ 69 ولاية. الطلب عبر واتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1512;--sand:#efe4d6;--sand2:#f8f2ea;--gold:#8a6a37;--paper:#fffdfa;--line:#e6d8c6;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.8;font-size:17px}
h1,h2,h3{font-family:"Reem Kufi","Tajawal",sans-serif;line-height:1.4}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
section{padding:56px 0}
section>.wrap>h2{font-size:clamp(25px,5vw,34px);margin-bottom:28px;text-align:center}

header{background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px}
header img{width:58px;height:58px;border-radius:50%}
header b{font-family:"Reem Kufi",sans-serif;font-size:19px}
#lang{margin-inline-start:auto;padding:8px 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#lang:hover{background:var(--ink);color:#fff}

.btn{display:inline-block;padding:14px 28px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font:inherit;font-weight:700;font-size:18px;border:0;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold)}
.btn.sm{padding:9px 20px;font-size:16px}

.hero{background:var(--sand);padding:40px 0 48px}
.hero .wrap{display:grid;gap:28px;align-items:center}
.hero h1{font-size:clamp(30px,6.5vw,50px)}
.hero p{margin:16px 0 26px;font-size:19px;max-width:30em}
.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:24px;max-height:520px}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover}
.card div{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:18px}
.card p{font-size:15px;color:#5e5247;flex:1}
.card .btn{text-align:center;margin-top:6px}
.more{margin-top:34px;text-align:center}
.more h3{font-size:19px;margin-bottom:14px;color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}

.why{background:var(--sand2)}
.feat{display:grid;gap:14px}
.feat div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.feat h3{font-size:20px;margin-bottom:4px}

.avis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.avis img{width:100%;border-radius:14px;border:1px solid var(--line)}
.avis-cta{text-align:center;padding:30px 20px;border:1px dashed var(--gold);border-radius:18px}
.avis-cta p{margin-bottom:16px}

.order{background:var(--ink);color:#fff}
.order h2{color:#fff}
form{max-width:560px;margin:0 auto;display:grid;gap:14px}
label{font-weight:500;display:grid;gap:6px;font-size:16px}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #6b5d51;background:#fff;color:var(--ink);font:inherit;font-size:17px}
form .btn{background:var(--sand);color:var(--ink);justify-self:stretch;margin-top:6px}
form .btn:hover{background:#fff}
.note{text-align:center;font-size:15px;color:#d9c9b4}

footer{padding:34px 0 90px;text-align:center;font-size:15px;color:#5e5247}
footer b{display:block;font-family:"Reem Kufi",sans-serif;font-size:19px;color:var(--ink);margin-bottom:8px}
footer a{color:var(--gold);font-weight:700;margin:0 10px}
footer p{margin-top:8px}

.float{position:fixed;inset-inline:16px;bottom:16px;z-index:5;text-align:center;box-shadow:0 8px 24px rgba(27,21,18,.3)}
@media(min-width:760px){
 .hero .wrap{grid-template-columns:1.1fr .9fr}
 .cards{grid-template-columns:repeat(4,1fr)}
 .gal{grid-template-columns:repeat(4,1fr)}
 .feat{grid-template-columns:repeat(3,1fr)}
 .avis{grid-template-columns:repeat(4,1fr)}
 .float{inset-inline:auto 24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function setLang(l){
  var d=T[l];
  document.documentElement.lang=l;
  document.documentElement.dir=(l==="ar")?"rtl":"ltr";
  document.title=d.title;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=d[e.getAttribute("data-i")];});
  document.getElementById("lang").textContent=d.btn;
  try{localStorage.setItem("lang",l);}catch(e){}
}
var saved="ar";
try{saved=localStorage.getItem("lang")||"ar";}catch(e){}
setLang(T[saved]?saved:"ar");
document.getElementById("lang").addEventListener("click",function(){setLang(document.documentElement.lang==="ar"?"fr":"ar");});

document.querySelectorAll("[data-p]").forEach(function(a){
  a.addEventListener("click",function(){document.getElementById("prod").selectedIndex=parseInt(a.getAttribute("data-p"),10)-1;});
